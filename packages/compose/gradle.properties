# 引入 Android 目标后必需：Compose Multiplatform 的依赖树里有 AndroidX 组件，
# 不开这个开关，checkDesktopMainComposeLibrariesCompatibility 会直接失败。
android.useAndroidX=true

# 让 Android 构建使用与桌面一致的 JVM 工具链（JDK 21）
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Kotlin 多平台：允许在不同目标间共享源码集
kotlin.mpp.enableCInteropCommonization=true

# 与 Android 模拟器共存：限制并发 worker 数与堆大小，避免 OOM
org.gradle.workers.max=2
org.gradle.daemon=false

# AGP 9 的内置 Kotlin 编译产物未进入 dex（类编译出来但 APK 里没有），
# 用官方提供的兼容开关回到传统 Kotlin 插件路径。
android.builtInKotlin=false
android.newDsl=false
