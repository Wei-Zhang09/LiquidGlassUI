<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LiquidGlassUI — Web 原型</title>
<link rel="stylesheet" href="../../packages/web/dist/tokens.css">
<style>
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 15px/1.6 system-ui, "Segoe UI", sans-serif;
    color: #fff;
    background:
      radial-gradient(ellipse 34rem 25rem at 13% 10%, rgb(255 255 255 / .96), transparent 68%),
      radial-gradient(ellipse 38rem 28rem at 88% 18%, rgb(143 197 245 / .72), transparent 64%),
      radial-gradient(ellipse 32rem 25rem at 76% 88%, rgb(222 187 235 / .46), transparent 63%),
      linear-gradient(135deg, #dfe7ee 0%, #f6f8fa 46%, #d5dee7 100%);
    background-attachment: fixed;
  }
  /* 高对比竖条纹：用来肉眼与像素级确认折射。
     不做遮罩 —— 玻璃背后必须有高对比内容，位移才可测可见。 */
  .stripes {
    position: fixed; inset: 0; pointer-events: none; opacity: .9;
    background: repeating-linear-gradient(90deg,
      #ff0055 0 20px, #00e5ff 20px 40px, #ffe600 40px 60px);
  }
  .stage {
    position: relative;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 28px; padding: 40px;
  }
  .row { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
  lg-glass-surface { padding: 16px 32px; font-weight: 500; }
  lg-glass-surface.tall { padding: 26px 34px; width: 300px; }
  .badge {
    position: fixed; top: 16px; right: 18px;
    font-size: 12px; padding: 6px 12px;
    border-radius: 999px; background: rgba(0,0,0,.55);
    backdrop-filter: blur(8px);
  }
  .legend {
    position: fixed; left: 18px; bottom: 16px;
    font-size: 12px; opacity: .8; line-height: 1.7;
  }
  code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
<div class="stripes"></div>

<div class="stage">
  <div class="row">
    <lg-glass-surface level="regular" radius="999">GlassSurface</lg-glass-surface>
    <lg-glass-surface level="elevated" radius="999">Elevated</lg-glass-surface>
    <lg-glass-surface level="focused" radius="999">Focused</lg-glass-surface>
  </div>

  <div class="row">
    <lg-glass-surface class="tall" level="elevated" radius="26" id="panel">
      <div style="font:600 16px/1.4 system-ui; margin-bottom:8px">边缘折射</div>
      <div style="font:400 13px/1.6 system-ui; opacity:.85">
        边缘带内的像素被 Snell 定律推挤，中心保持清晰。
      </div>
    </lg-glass-surface>
  </div>
</div>

<div class="badge" id="badge">检测中…</div>
<div class="legend">
  降级阶梯：<code>refraction</code> → <code>frost</code> → <code>solid</code><br>
  当前：<span id="level">—</span>
</div>

<script type="module">
  import { defineAll, getGlassCapabilities } from '../../packages/web/dist/index.js'
  defineAll()

  const caps = getGlassCapabilities()
  const badge = document.getElementById('badge')
  badge.textContent = caps.refraction
    ? '真折射已启用'
    : caps.backdropFilter
      ? '降级：磨砂（无折射）'
      : '降级：实心'

  // 等一帧让 ResizeObserver 跑完，再读取实际降级层级
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const el = document.getElementById('panel')
    document.getElementById('level').textContent = el.getAttribute('data-support')
    // 供自动化测试读取
    window.__lg = {
      caps,
      support: el.getAttribute('data-support'),
      filterVar: getComputedStyle(el).getPropertyValue('--lg-filter').trim(),
    }
  }))
</script>
</body>
</html>
