name: Deploy docs

# 只在文档站或 Web 组件源码变化时触发 ——
# 文档站直接引用 packages/web/src，所以组件改了也要重新构建。
on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'packages/web/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# GitHub Pages 部署所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署；不取消进行中的（避免发布出半成品）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install
        working-directory: docs/site
        run: npm ci

      # base 必须是 /<repo>/，否则 Pages 子路径下所有资源 404。
      # 用仓库名动态取，改仓库名也不会坏。
      - name: Build
        working-directory: docs/site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
